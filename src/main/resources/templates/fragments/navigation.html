<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>

<nav th:fragment="navigation" class="main-nav">

    <a href="/movies" class="btn-buy-ticket">
        <i class="fa-solid fa-ticket"></i>
        <span>MUA VÉ NGAY</span>
    </a>

    <!-- Phim — Mega Dropdown -->
    <div class="nav-item has-mega">
        <a href="/movies" class="nav-link">
            Phim <i class="fa-solid fa-chevron-down"></i>
        </a>
        <div class="mega-dropdown mega-movies">
            <div class="mega-section">
                <h4 class="mega-heading">Phim Đang Chiếu</h4>
                <div class="mega-movie-grid">
                    <a th:each="m : ${navNowShowing}" th:href="@{/movies/{id}(id=${m.id})}" class="mega-movie-card">
                        <div class="mega-poster-wrap">
                            <img th:if="${m.posterUrl != null}" th:src="${m.posterUrl}" th:alt="${m.title}" loading="lazy"/>
                            <div th:if="${m.posterUrl == null}" class="mega-poster-placeholder"><i class="fa-solid fa-film"></i></div>
                        </div>
                        <span class="mega-movie-title" th:text="${m.title}">Movie</span>
                    </a>
                </div>
            </div>
            <div class="mega-divider"></div>
            <div class="mega-section">
                <h4 class="mega-heading">Phim Sắp Chiếu</h4>
                <div class="mega-movie-grid">
                    <a th:each="m : ${navComingSoon}" th:href="@{/movies/{id}(id=${m.id})}" class="mega-movie-card">
                        <div class="mega-poster-wrap">
                            <img th:if="${m.posterUrl != null}" th:src="${m.posterUrl}" th:alt="${m.title}" loading="lazy"/>
                            <div th:if="${m.posterUrl == null}" class="mega-poster-placeholder"><i class="fa-solid fa-film"></i></div>
                        </div>
                        <span class="mega-movie-title" th:text="${m.title}">Movie</span>
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- Góc Điện Ảnh — Simple Dropdown -->
    <div class="nav-item has-dropdown">
        <a href="javascript:void(0)" class="nav-link">
            Góc Điện Ảnh <i class="fa-solid fa-chevron-down"></i>
        </a>
        <div class="nav-dropdown">
            <a href="javascript:void(0)" class="nav-dropdown-item">Thể Loại Phim</a>
            <a href="javascript:void(0)" class="nav-dropdown-item">Diễn Viên</a>
            <a href="javascript:void(0)" class="nav-dropdown-item">Đạo Diễn</a>
            <a href="javascript:void(0)" class="nav-dropdown-item">Bình Luận Phim</a>
            <a href="javascript:void(0)" class="nav-dropdown-item">Blog Điện Ảnh</a>
        </div>
    </div>

    <!-- Sự Kiện -->
    <div class="nav-item has-dropdown">
        <a href="javascript:void(0)" class="nav-link">
            Sự Kiện <i class="fa-solid fa-chevron-down"></i>
        </a>
        <div class="nav-dropdown">
            <a href="javascript:void(0)" class="nav-dropdown-item">Ưu Đãi</a>
            <a href="javascript:void(0)" class="nav-dropdown-item">Phim Hay Tháng</a>
        </div>
    </div>

    <!-- Rạp / Giá Vé -->
    <div class="nav-item has-dropdown">
        <a href="javascript:void(0)" class="nav-link">
            Rạp / Giá Vé <i class="fa-solid fa-chevron-down"></i>
        </a>
        <div class="nav-dropdown">
            <a href="javascript:void(0)" class="nav-dropdown-item">Hệ Thống Rạp</a>
            <a href="javascript:void(0)" class="nav-dropdown-item">Giá Vé</a>
        </div>
    </div>
</nav>

</body>
</html>
