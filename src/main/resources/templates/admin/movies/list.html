<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/admin-layout :: layout('Quản lý Phim', ~{::pageContent})}">
<body>
<th:block th:fragment="pageContent">
    <link rel="stylesheet" th:href="@{/css/admin/movies.css}"/>

    <div class="page-header">
        <h1><i class="fa-solid fa-film"></i> Quản lý Phim</h1>
        <a th:href="@{/admin/movies/tmdb-search}" class="btn-add">
            <i class="fa-solid fa-plus"></i> Thêm phim từ TMDB
        </a>
    </div>

    <!-- Toast messages -->
    <div th:if="${successMessage}" class="toast-auto" data-type="success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="toast-auto" data-type="error" th:text="${errorMessage}"></div>

    <!-- Filter Bar -->
    <form th:action="@{/admin/movies}" method="get" class="filter-bar">
        <input type="text" name="keyword" th:value="${keyword}"
               placeholder="Tìm kiếm theo tên phim..."/>
        <select name="status">
            <option value="">Tất cả trạng thái</option>
            <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}"
                    th:selected="${s.name() == status}"></option>
        </select>
        <button type="submit" class="btn-filter">
            <i class="fa-solid fa-search"></i> Tìm kiếm
        </button>
    </form>

    <!-- Movie Table -->
    <div th:if="${movies.totalElements > 0}">
        <table class="movie-table">
            <thead>
            <tr>
                <th>Poster</th>
                <th>Tên phim</th>
                <th>Thể loại</th>
                <th>Thời lượng</th>
                <th>Đánh giá</th>
                <th>Trạng thái</th>
                <th>Thao tác</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="movie : ${movies.content}">
                <td>
                    <img th:if="${movie.posterUrl != null}" th:src="${movie.posterUrl}"
                         alt="poster" class="movie-poster"/>
                    <div th:if="${movie.posterUrl == null}" class="movie-poster movie-poster-empty">
                        <i class="fa-solid fa-image"></i>
                    </div>
                </td>
                <td><span class="movie-title" th:text="${movie.title}"></span></td>
                <td>
                    <div class="movie-genres">
                        <span th:each="genre : ${movie.genres}" class="genre-tag"
                              th:text="${genre.name}"></span>
                    </div>
                </td>
                <td th:text="${movie.durationMinutes + ' phút'}"></td>
                <td>
                    <span th:if="${movie.voteAverage != null}">
                        <i class="fa-solid fa-star star-icon"></i>
                        <span th:text="${#numbers.formatDecimal(movie.voteAverage, 1, 1)}"></span>
                    </span>
                </td>
                <td>
                    <span class="status-badge"
                          th:classappend="'status-' + ${movie.status}"
                          th:text="${movie.status}"></span>
                </td>
                <td>
                    <div class="action-btns">
                        <a th:href="@{/admin/movies/{id}/edit(id=${movie.id})}" class="btn-edit">
                            <i class="fa-solid fa-pen"></i> Sửa
                        </a>
                        <form th:action="@{/admin/movies/{id}/delete(id=${movie.id})}"
                              method="post" class="inline-form"
                              data-confirm="Bạn chắc chắn muốn ẩn phim này?">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button type="submit" class="btn-delete">
                                <i class="fa-solid fa-eye-slash"></i> Ẩn
                            </button>
                        </form>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>

        <!-- Pagination -->
        <div class="pagination" th:if="${movies.totalPages > 1}">
            <a th:if="${movies.number > 0}"
               th:href="@{/admin/movies(keyword=${keyword}, status=${status}, page=${movies.number - 1})}">
                &laquo; Trước
            </a>
            <th:block th:each="i : ${#numbers.sequence(0, movies.totalPages - 1)}">
                <span th:if="${i == movies.number}" class="active" th:text="${i + 1}"></span>
                <a th:if="${i != movies.number}"
                   th:href="@{/admin/movies(keyword=${keyword}, status=${status}, page=${i})}"
                   th:text="${i + 1}"></a>
            </th:block>
            <a th:if="${movies.number < movies.totalPages - 1}"
               th:href="@{/admin/movies(keyword=${keyword}, status=${status}, page=${movies.number + 1})}">
                Sau &raquo;
            </a>
        </div>
    </div>

    <!-- Empty State -->
    <div th:if="${movies.totalElements == 0}" class="empty-state">
        <i class="fa-solid fa-film"></i>
        <p>Chưa có phim nào trong hệ thống.</p>
        <a th:href="@{/admin/movies/tmdb-search}" class="btn-add btn-add-spaced">
            <i class="fa-solid fa-plus"></i> Thêm phim từ TMDB
        </a>
    </div>

    <!-- Confirm Modal for Delete -->
    <div id="deleteConfirmModal" class="confirm-overlay">
        <div class="confirm-box">
            <div class="confirm-icon">
                <i class="fa-solid fa-triangle-exclamation"></i>
            </div>
            <h3 class="confirm-title">Xác nhận Ẩn Phim</h3>
            <p class="confirm-desc" id="deleteConfirmDesc">Bạn chắc chắn muốn ẩn phim này?</p>
            <div class="confirm-actions">
                <button type="button" class="confirm-btn cancel" onclick="hideDeleteConfirm()">Huỷ</button>
                <button type="button" class="confirm-btn danger" onclick="submitDeleteForm()">Xác nhận</button>
            </div>
        </div>
    </div>

    <script th:src="@{/js/admin/movie-list.js}"></script>
</th:block>
</body>
</html>
