<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/admin-layout :: layout('Chỉnh sửa Phim', ~{::pageContent})}">
<body>
<th:block th:fragment="pageContent">
    <link rel="stylesheet" th:href="@{/css/admin/movies.css}"/>

    <div class="page-header">
        <h1><i class="fa-solid fa-pen-to-square"></i> Chỉnh sửa Phim</h1>
    </div>

    <form th:action="@{/admin/movies/{id}(id=${movie.id})}" method="post" class="edit-form">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <!-- Poster Preview -->
        <img th:if="${movie.posterUrl != null}" th:src="${movie.posterUrl}"
             alt="poster" class="poster-preview"/>

        <div class="form-group">
            <label>Tên phim</label>
            <input type="text" name="title" th:value="${movie.title}" required/>
        </div>

        <div class="form-group">
            <label>Mô tả</label>
            <textarea name="description" th:text="${movie.description}"></textarea>
        </div>

        <div class="form-group">
            <label>Thời lượng (phút)</label>
            <input type="number" name="durationMinutes" th:value="${movie.durationMinutes}" min="1" required/>
        </div>

        <div class="form-group">
            <label>Trạng thái</label>
            <select name="status">
                <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}"
                        th:selected="${s == movie.status}"></option>
            </select>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn-save">
                <i class="fa-solid fa-floppy-disk"></i> Lưu thay đổi
            </button>
            <a th:href="@{/admin/movies}" class="btn-cancel">Hủy bỏ</a>
        </div>
    </form>
</th:block>
</body>
</html>
