<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/admin-layout :: layout('Dashboard', ~{::pageContent})}">
<body>
<th:block th:fragment="pageContent">
    <link rel="stylesheet" th:href="@{/css/admin/dashboard.css}"/>

    <div class="dashboard-header">
        <h1><i class="fa-solid fa-chart-pie"></i> Dashboard</h1>
    </div>

    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-card-inner">
                <div class="stat-icon cyan">
                    <i class="fa-solid fa-film"></i>
                </div>
                <div>
                    <p class="stat-label">Tổng phim</p>
                    <h3 class="stat-value" th:text="${stats.totalMovies}">0</h3>
                </div>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-card-inner">
                <div class="stat-icon purple">
                    <i class="fa-solid fa-ticket"></i>
                </div>
                <div>
                    <p class="stat-label">Vé đã bán</p>
                    <h3 class="stat-value" th:text="${stats.totalTicketsSold}">0</h3>
                </div>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-card-inner">
                <div class="stat-icon green">
                    <i class="fa-solid fa-money-bill-trend-up"></i>
                </div>
                <div>
                    <p class="stat-label">Doanh thu</p>
                    <h3 class="stat-value"
                        th:text="${#numbers.formatDecimal(stats.totalRevenue, 0, 'COMMA', 0, 'POINT') + 'đ'}">0đ</h3>
                </div>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-card-inner">
                <div class="stat-icon yellow">
                    <i class="fa-solid fa-users"></i>
                </div>
                <div>
                    <p class="stat-label">Khách hàng</p>
                    <h3 class="stat-value" th:text="${stats.totalCustomers}">0</h3>
                </div>
            </div>
        </div>
    </div>

    <div class="dashboard-grid">
        <div class="dashboard-card">
            <div class="dc-header">
                <h2 class="dc-title"><i class="fa-solid fa-clock-rotate-left"></i> Đơn đặt gần đây</h2>
            </div>
            <div class="dc-body">
                <table class="dash-table" th:if="${!stats.recentBookings.isEmpty()}">
                    <thead>
                    <tr>
                        <th>Mã đơn</th>
                        <th>Khách hàng</th>
                        <th>Phim</th>
                        <th>Ngày đặt</th>
                        <th>Tổng tiền</th>
                        <th>Trạng thái</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="b : ${stats.recentBookings}">
                        <td class="code-cell" th:text="${b.bookingCode}">ABC123</td>
                        <td th:text="${b.customerName}">Nguyễn Văn A</td>
                        <td class="movie-cell" th:text="${b.movieTitle}">Movie</td>
                        <td th:text="${#dates.format(b.bookingDate, 'HH:mm dd/MM')}">10:30 20/05</td>
                        <td class="amount-cell"
                            th:text="${#numbers.formatDecimal(b.totalAmount, 0, 'COMMA', 0, 'POINT') + 'đ'}">155,000đ</td>
                        <td>
                            <span class="status-pill"
                                  th:classappend="${b.status == 'CONFIRMED' ? 'confirmed' :
                                                   (b.status == 'CANCELLED' ? 'cancelled' :
                                                   (b.status == 'CHECKED_IN' ? 'checked-in' : 'pending'))}"
                                  th:text="${b.status == 'CONFIRMED' ? 'Xác nhận' :
                                           (b.status == 'CANCELLED' ? 'Đã hủy' :
                                           (b.status == 'CHECKED_IN' ? 'Đã check-in' : 'Chờ'))}">Status</span>
                        </td>
                    </tr>
                    </tbody>
                </table>
                <div th:if="${stats.recentBookings.isEmpty()}" class="empty-msg">
                    <i class="fa-regular fa-folder-open"></i>
                    <p>Chưa có đơn đặt nào</p>
                </div>
            </div>
        </div>

        <div class="dashboard-card">
            <div class="dc-header">
                <h2 class="dc-title"><i class="fa-solid fa-trophy"></i> Top 5 Phim</h2>
            </div>
            <div class="dc-body">
                <div class="top-movies-list" th:if="${!stats.topMovies.isEmpty()}">
                    <div th:each="m, idx : ${stats.topMovies}" class="top-movie-item">
                        <span class="top-rank" th:text="${idx.index + 1}">1</span>
                        <img th:if="${m.posterUrl != null}" th:src="${m.posterUrl}" class="top-poster" alt="" />
                        <div class="top-movie-info">
                            <span class="top-movie-name" th:text="${m.title}">Movie</span>
                            <span class="top-movie-stat">
                                <i class="fa-solid fa-ticket"></i>
                                <span th:text="${m.ticketCount} + ' vé'">50 vé</span>
                                <span class="top-sep">|</span>
                                <span th:text="${#numbers.formatDecimal(m.revenue, 0, 'COMMA', 0, 'POINT') + 'đ'}">5,000,000đ</span>
                            </span>
                        </div>
                    </div>
                </div>
                <div th:if="${stats.topMovies.isEmpty()}" class="empty-msg">
                    <i class="fa-regular fa-folder-open"></i>
                    <p>Chưa có dữ liệu</p>
                </div>
            </div>
        </div>
    </div>

</th:block>
</body>
</html>
