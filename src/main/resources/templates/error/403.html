<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>CineWave - Truy cập bị từ chối</title>

    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>

    <link rel="stylesheet" th:href="@{/css/error.css}"/>
</head>
<body>
<div class="error-container">
    <div class="error-icon">
        <i class="fa-solid fa-shield-halved"></i>
    </div>
    <div class="error-code">403</div>
    <h1 class="error-title">Truy cập bị từ chối</h1>
    <p class="error-desc">
        Bạn không có quyền truy cập trang này.<br/>
        Vui lòng liên hệ quản trị viên nếu bạn cho rằng đây là lỗi.
    </p>
    <div class="error-actions">
        <a href="/" class="btn-back btn-primary-err">
            <i class="fa-solid fa-house"></i> Về trang chủ
        </a>
        <a href="javascript:history.back()" class="btn-back btn-ghost">
            <i class="fa-solid fa-arrow-left"></i> Quay lại
        </a>
    </div>
</div>
</body>
</html>
