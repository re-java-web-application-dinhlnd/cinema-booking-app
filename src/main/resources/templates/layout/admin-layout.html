<!doctype html>
<html
  lang="vi"
  xmlns:th="http://www.thymeleaf.org"
  th:fragment="layout(pageTitle, pageContent)"
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="'CineWave Admin - ' + ${pageTitle}">CineWave Admin</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <link rel="stylesheet" th:href="@{/css/admin/admin-layout.css}" />

    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />
  </head>
  <body>
    <div class="admin-wrapper">
      <!-- ========== SIDEBAR ========== -->
      <aside class="admin-sidebar" id="adminSidebar">
        <!-- Brand -->
        <div class="sidebar-brand">
          <img th:src="@{/assets/logo.png}" alt="CineWave" />
          <span>CineWave</span>
        </div>

        <!-- Navigation -->
        <nav class="sidebar-nav">
          <div class="nav-section">
            <span class="nav-section-title">TỔNG QUAN</span>
            <a href="/admin/dashboard" class="nav-link" data-page="dashboard">
              <i class="fa-solid fa-chart-pie"></i>
              <span>Dashboard</span>
            </a>
          </div>

          <div class="nav-section">
            <span class="nav-section-title">QUẢN LÝ NỘI DUNG</span>
            <a href="/admin/movies" class="nav-link" data-page="movies">
              <i class="fa-solid fa-film"></i>
              <span>Quản lý Phim</span>
            </a>
            <a href="/admin/showtimes" class="nav-link" data-page="showtimes">
              <i class="fa-solid fa-calendar-days"></i>
              <span>Suất chiếu</span>
            </a>
          </div>

          <div class="nav-section">
            <span class="nav-section-title">TÀI KHOẢN</span>
            <a href="/admin/profile" class="nav-link" data-page="profile">
              <i class="fa-solid fa-user-gear"></i>
              <span>Hồ sơ cá nhân</span>
            </a>
            <a
              href="javascript:void(0)"
              class="nav-link"
              onclick="showLogoutConfirm()"
            >
              <i class="fa-solid fa-right-from-bracket"></i>
              <span>Đăng xuất</span>
            </a>
          </div>
        </nav>

        <!-- Sidebar Footer -->
        <div class="sidebar-footer">
          <div class="sidebar-user">
            <i class="fa-solid fa-shield-halved"></i>
            <span>Administrator</span>
          </div>
        </div>
      </aside>

      <!-- ========== MAIN AREA ========== -->
      <div class="admin-main">
        <!-- Top Header Bar -->
        <header class="admin-header">
          <button class="sidebar-toggle" onclick="toggleSidebar()">
            <i class="fa-solid fa-bars"></i>
          </button>
          <h2 class="header-title" th:text="${pageTitle}">Page Title</h2>
          <div class="header-actions">
            <a
              href="/"
              target="_blank"
              class="header-btn"
              title="Xem trang khách hàng"
            >
              <i class="fa-solid fa-external-link-alt"></i>
            </a>
          </div>
        </header>

        <!-- Page Content -->
        <main class="admin-content">
          <th:block th:replace="${pageContent}"></th:block>
        </main>
      </div>
    </div>

    <!-- Logout Confirm Dialog -->
    <div id="logoutConfirm" class="confirm-overlay">
      <div class="confirm-box">
        <div class="confirm-icon">
          <i class="fa-solid fa-right-from-bracket"></i>
        </div>
        <h3 class="confirm-title">Đăng xuất?</h3>
        <p class="confirm-desc">Bạn có chắc muốn đăng xuất không?</p>
        <div class="confirm-actions">
          <button class="confirm-btn cancel" onclick="hideLogoutConfirm()">
            Huỷ
          </button>
          <button class="confirm-btn danger" onclick="submitLogout()">
            Đăng xuất
          </button>
        </div>
      </div>
    </div>

    <form
      id="logoutForm"
      th:action="@{/logout}"
      method="post"
      style="display: none"
    >
      <input
        type="hidden"
        th:name="${_csrf.parameterName}"
        th:value="${_csrf.token}"
      />
    </form>

    <!-- Toast -->
    <div id="toastContainer"></div>

    <script th:src="@{/js/global.js}"></script>
    <script>
      // Highlight active nav link
      document.querySelectorAll(".nav-link[data-page]").forEach((link) => {
        if (window.location.pathname.includes(link.dataset.page)) {
          link.classList.add("active");
        }
      });

      // Sidebar toggle (mobile)
      function toggleSidebar() {
        document.getElementById("adminSidebar").classList.toggle("collapsed");
        document.querySelector(".admin-main").classList.toggle("expanded");
      }

      function showLogoutConfirm() {
        document.getElementById("logoutConfirm").classList.add("show");
      }
      function hideLogoutConfirm() {
        document.getElementById("logoutConfirm").classList.remove("show");
      }
      function submitLogout() {
        document.getElementById("logoutForm").submit();
      }
    </script>
  </body>
</html>
