<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:fragment="layout(pageTitle, pageContent)">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="'CineWave POS - ' + ${pageTitle}">CineWave POS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
    <link rel="stylesheet" th:href="@{/css/base.css}"/>
    <link rel="stylesheet" th:href="@{/css/modal.css}"/>
    <link rel="stylesheet" th:href="@{/css/toast.css}"/>
    <link rel="stylesheet" th:href="@{/css/staff/staff-layout.css}"/>
    <link rel="icon" type="image/png" th:href="@{/assets/logo.png}">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
</head>
<body>

<div class="staff-topbar">
    <div class="topbar-left">
        <a href="/pos/dashboard" class="topbar-brand">
            <img th:src="@{/assets/auth_logo.png}" alt="CineWave"/>
            <span>CineWave <strong>POS</strong></span>
        </a>
    </div>
    <div class="topbar-right">
        <a href="/pos/dashboard" class="topbar-link" data-page="dashboard">
            <i class="fa-solid fa-cash-register"></i> Bán vé
        </a>
        <a href="/pos/profile" class="topbar-link" data-page="profile">
            <i class="fa-solid fa-user-gear"></i> Hồ sơ
        </a>
        <button type="button" class="topbar-link logout-btn" onclick="showLogoutConfirm()">
            <i class="fa-solid fa-right-from-bracket"></i> Đăng xuất
        </button>
    </div>
</div>

<main th:replace="${pageContent}">
</main>

<div id="logoutConfirm" class="confirm-overlay">
    <div class="confirm-box">
        <div class="confirm-icon"><i class="fa-solid fa-right-from-bracket"></i></div>
        <h3 class="confirm-title">Đăng xuất?</h3>
        <p class="confirm-desc">Bạn có chắc muốn đăng xuất?</p>
        <div class="confirm-actions">
            <button class="confirm-btn cancel" onclick="hideLogoutConfirm()">Huỷ</button>
            <button class="confirm-btn danger" onclick="submitLogout()">Đăng xuất</button>
        </div>
    </div>
</div>

<form id="logoutForm" th:action="@{/logout}" method="post" hidden>
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
</form>

<div id="toastContainer"></div>

<script th:src="@{/js/global.js}"></script>

<script th:inline="javascript">
    document.addEventListener('DOMContentLoaded', () => {
        const path = window.location.pathname;
        document.querySelectorAll('.topbar-link[data-page]').forEach(link => {
            const page = link.dataset.page;
            if ((page === 'dashboard' && path.startsWith('/pos/dashboard')) ||
                (page === 'dashboard' && path.startsWith('/pos/bookings')) ||
                (page === 'profile' && path.startsWith('/pos/profile'))) {
                link.classList.add('active');
            }
        });
    });
</script>

</body>
</html>
