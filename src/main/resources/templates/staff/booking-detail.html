<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/staff-layout :: layout('Chi tiết đơn', ~{::pageContent})}">
<body>
<th:block th:fragment="pageContent">
    <link rel="stylesheet" th:href="@{/css/staff/pos.css}"/>

    <div class="pos-wrapper">
        <a href="/pos/dashboard" class="back-link">
            <i class="fa-solid fa-arrow-left"></i> Quay lại danh sách
        </a>

        <div class="detail-card">
            <div class="detail-header">
                <div class="detail-header-left">
                    <h1 class="detail-title">Chi tiết đơn đặt vé</h1>
                    <span class="detail-code" th:text="'#' + ${booking.bookingCode}">Code</span>
                </div>
                <span class="pos-status lg"
                      th:classappend="${booking.status.name() == 'CONFIRMED' ? 'confirmed' :
                                       (booking.status.name() == 'CANCELLED' ? 'cancelled' :
                                       (booking.status.name() == 'CHECKED_IN' ? 'checked-in' : 'pending'))}"
                      th:text="${booking.status.name() == 'CONFIRMED' ? 'Đã xác nhận' :
                               (booking.status.name() == 'CANCELLED' ? 'Đã hủy' :
                               (booking.status.name() == 'CHECKED_IN' ? 'Đã check-in' : 'Chờ xử lý'))}">Status</span>
            </div>

            <div class="detail-body">
                <div class="detail-section">
                    <h3 class="section-title"><i class="fa-solid fa-user"></i> Khách hàng</h3>
                    <div class="detail-row">
                        <span class="detail-label">Họ tên</span>
                        <span class="detail-value"
                              th:text="${booking.user != null and booking.user.userProfile != null ? booking.user.userProfile.fullName : 'N/A'}">Nguyễn Văn A</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">SĐT</span>
                        <span class="detail-value"
                              th:text="${booking.user != null and booking.user.userProfile != null and booking.user.userProfile.phoneNumber != null ? booking.user.userProfile.phoneNumber : '---'}">0912345678</span>
                    </div>
                </div>

                <div class="detail-section" th:if="${!booking.tickets.isEmpty()}">
                    <h3 class="section-title"><i class="fa-solid fa-film"></i> Thông tin phim</h3>
                    <div class="detail-row">
                        <span class="detail-label">Phim</span>
                        <span class="detail-value"
                              th:text="${booking.tickets[0].showtime.movie.title}">Movie</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Suất chiếu</span>
                        <span class="detail-value"
                              th:text="${#dates.format(booking.tickets[0].showtime.startTime, 'HH:mm dd/MM/yyyy')}">14:00</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Phòng</span>
                        <span class="detail-value"
                              th:text="${booking.tickets[0].showtime.room.name}">Room 1</span>
                    </div>
                </div>

                <div class="detail-section">
                    <h3 class="section-title"><i class="fa-solid fa-chair"></i> Ghế</h3>
                    <div class="seat-chips">
                        <span th:each="t : ${booking.tickets}" class="seat-chip"
                              th:text="${t.seat.seatName}">A1</span>
                    </div>
                </div>

                <div class="detail-section" th:if="${!booking.bookingProducts.isEmpty()}">
                    <h3 class="section-title"><i class="fa-solid fa-popcorn"></i> Combo/Sản phẩm</h3>
                    <div th:each="bp : ${booking.bookingProducts}" class="detail-row">
                        <span class="detail-label"
                              th:text="${bp.product.name + ' x' + bp.quantity}">Popcorn x2</span>
                        <span class="detail-value"
                              th:text="${#numbers.formatDecimal(bp.price, 0, 'COMMA', 0, 'POINT') + 'đ'}">60,000đ</span>
                    </div>
                </div>

                <div class="detail-divider"></div>
                <div class="detail-row total-row">
                    <span class="detail-label">Tổng thanh toán</span>
                    <span class="detail-value total-amount"
                          th:text="${#numbers.formatDecimal(booking.totalAmount, 0, 'COMMA', 0, 'POINT') + 'đ'}">155,000đ</span>
                </div>
            </div>

            <div th:if="${canCheckIn}" class="detail-actions">
                <button type="button" class="checkin-btn" onclick="showCheckInConfirm()">
                    <i class="fa-solid fa-qrcode"></i> Check-in
                </button>
            </div>
        </div>
    </div>

    <div id="checkInConfirm" class="confirm-overlay" th:if="${canCheckIn}">
        <div class="confirm-box">
            <div class="confirm-icon checkin-icon">
                <i class="fa-solid fa-qrcode"></i>
            </div>
            <h3 class="confirm-title">Xác nhận Check-in</h3>
            <p class="confirm-desc">Xác nhận khách hàng đã đến xem phim?</p>
            <div class="confirm-actions">
                <button class="confirm-btn cancel" onclick="hideCheckInConfirm()">Huỷ</button>
                <button class="confirm-btn danger checkin-confirm-btn" onclick="submitCheckIn()">Check-in</button>
            </div>
        </div>
    </div>

    <form id="checkInForm" th:if="${canCheckIn}"
          th:action="@{'/pos/bookings/' + ${booking.bookingCode} + '/checkin'}"
          method="post" hidden>
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
    </form>

    <script th:src="@{/js/staff/pos.js}"></script>

</th:block>
</body>
</html>
