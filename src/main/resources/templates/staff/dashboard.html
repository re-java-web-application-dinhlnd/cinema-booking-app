<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/staff-layout :: layout('Bán vé', ~{::pageContent})}">
<body>
<th:block th:fragment="pageContent">
    <link rel="stylesheet" th:href="@{/css/staff/pos.css}"/>

    <div class="pos-wrapper">
        <div class="pos-header">
            <h1 class="pos-title"><i class="fa-solid fa-magnifying-glass"></i> Tra cứu đơn đặt vé</h1>
            <form class="pos-search-form" th:action="@{/pos/dashboard}" method="get">
                <div class="search-input-wrap">
                    <i class="fa-solid fa-search search-icon"></i>
                    <input type="text" name="keyword" class="search-input"
                           placeholder="Nhập mã đơn, tên khách hàng hoặc SĐT..."
                           th:value="${keyword}" autocomplete="off"/>
                </div>
                <button type="submit" class="search-btn">Tìm kiếm</button>
            </form>
        </div>

        <div class="pos-results">
            <div th:if="${bookings.isEmpty()}" class="pos-empty">
                <i class="fa-regular fa-folder-open"></i>
                <p th:if="${keyword != null and !keyword.isEmpty()}"
                   th:text="'Không tìm thấy kết quả cho: ' + ${keyword}">Không tìm thấy</p>
                <p th:if="${keyword == null or keyword.isEmpty()}">Chưa có đơn đặt vé nào</p>
            </div>

            <table class="pos-table" th:if="${!bookings.isEmpty()}">
                <thead>
                <tr>
                    <th>Mã đơn</th>
                    <th>Khách hàng</th>
                    <th>SĐT</th>
                    <th>Phim</th>
                    <th>Suất chiếu</th>
                    <th>Ghế</th>
                    <th>Tổng tiền</th>
                    <th>Trạng thái</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="b : ${bookings}">
                    <td class="code-cell" th:text="${b.bookingCode}">ABC123</td>
                    <td th:text="${b.user != null and b.user.userProfile != null ? b.user.userProfile.fullName : 'N/A'}">Nguyễn Văn A</td>
                    <td th:text="${b.user != null and b.user.userProfile != null and b.user.userProfile.phoneNumber != null ? b.user.userProfile.phoneNumber : '---'}">0912345678</td>
                    <td class="movie-cell"
                        th:text="${!b.tickets.isEmpty() ? b.tickets[0].showtime.movie.title : 'N/A'}">Movie</td>
                    <td th:if="${!b.tickets.isEmpty()}"
                        th:text="${#dates.format(b.tickets[0].showtime.startTime, 'HH:mm dd/MM')}">14:00 20/05</td>
                    <td th:if="${b.tickets.isEmpty()}">---</td>
                    <td th:text="${b.tickets.size()} + ' ghế'">2 ghế</td>
                    <td class="amount-cell"
                        th:text="${#numbers.formatDecimal(b.totalAmount, 0, 'COMMA', 0, 'POINT') + 'đ'}">155,000đ</td>
                    <td>
                        <span class="pos-status"
                              th:classappend="${b.status.name() == 'CONFIRMED' ? 'confirmed' :
                                               (b.status.name() == 'CANCELLED' ? 'cancelled' :
                                               (b.status.name() == 'CHECKED_IN' ? 'checked-in' : 'pending'))}"
                              th:text="${b.status.name() == 'CONFIRMED' ? 'Xác nhận' :
                                       (b.status.name() == 'CANCELLED' ? 'Đã hủy' :
                                       (b.status.name() == 'CHECKED_IN' ? 'Đã check-in' : 'Chờ'))}">Status</span>
                    </td>
                    <td>
                        <a th:href="@{'/pos/bookings/' + ${b.bookingCode}}" class="pos-view-btn">
                            <i class="fa-solid fa-eye"></i>
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>

            <div th:if="${bookings.totalPages > 1}" class="pos-pagination">
                <a th:href="@{/pos/dashboard(keyword=${keyword}, page=${currentPage - 1})}"
                   th:classappend="${currentPage == 0 ? 'disabled' : ''}"
                   class="page-btn"><i class="fa-solid fa-chevron-left"></i></a>
                <th:block th:each="i : ${#numbers.sequence(0, bookings.totalPages - 1)}">
                    <a th:href="@{/pos/dashboard(keyword=${keyword}, page=${i})}"
                       class="page-btn" th:classappend="${i == currentPage ? 'active' : ''}"
                       th:text="${i + 1}">1</a>
                </th:block>
                <a th:href="@{/pos/dashboard(keyword=${keyword}, page=${currentPage + 1})}"
                   th:classappend="${currentPage >= bookings.totalPages - 1 ? 'disabled' : ''}"
                   class="page-btn"><i class="fa-solid fa-chevron-right"></i></a>
            </div>
        </div>
    </div>

</th:block>
</body>
</html>
