<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>CineWave - Đăng nhập Nhân viên</title>

    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>

    <link rel="stylesheet" th:href="@{/css/base.css}"/>
    <link rel="stylesheet" th:href="@{/css/modal.css}"/>
    <link rel="stylesheet" th:href="@{/css/staff/main.css}"/>
</head>
<body>
<div class="staff-layout">

    <div class="staff-branding">
        <div class="branding-content">
            <img th:src="@{/assets/auth_logo.png}" alt="CineWave Logo" class="brand-logo"/>
            <h2>Chào mừng trở lại!</h2>
            <p>Hệ thống quản lý điểm bán vé và dịch vụ dành riêng cho đội ngũ nhân viên CineWave.</p>
        </div>
    </div>

    <div class="staff-login-container">
        <div class="login-card">
            <div class="mobile-logo">
                <img th:src="@{/assets/auth_logo.png}" alt="CineWave Logo"/>
            </div>

            <div class="header-text">
                <h1>Cổng Nhân Viên</h1>
                <p>Vui lòng đăng nhập để bắt đầu ca làm việc</p>
            </div>

            <form th:action="@{/process-login}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <div class="form-group">
                    <label class="form-label">Tên đăng nhập</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-id-badge prefix-icon"></i>
                        <input
                                type="text"
                                name="username"
                                class="form-input"
                                th:value="${param.username != null ? param.username[0] : ''}"
                                required
                                autofocus
                        />
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Mật khẩu</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock prefix-icon"></i>
                        <input
                                type="password"
                                name="password"
                                id="staffPassword"
                                class="form-input"
                                placeholder="Nhập mật khẩu"
                                required
                        />
                        <button type="button" class="btn-toggle-password" onclick="toggleStaffPassword()">
                            <i class="fa-regular fa-eye-slash"></i>
                        </button>
                    </div>

                    <div class="form-options">
                        <label class="remember-me">
                            <input type="checkbox" name="remember-me"/>
                            <span>Ghi nhớ đăng nhập</span>
                        </label>
                        <a href="/staff/forgot-password" class="forgot-link">Quên mật khẩu?</a>
                    </div>
                </div>

                <button type="submit" class="btn-submit btn-staff">BẮT ĐẦU CA LÀM VIỆC</button>
            </form>

            <a href="/" class="back-link">
                <i class="fa-solid fa-arrow-left"></i> Quay lại trang khách hàng
            </a>
        </div>
    </div>
</div>

<div id="toastContainer"></div>

<script th:src="@{/js/global.js}"></script>
<script>
    function toggleStaffPassword() {
        const input = document.getElementById("staffPassword");
        const icon = document.querySelector(".btn-toggle-password i");
        const isHidden = input.type === "password";
        input.type = isHidden ? "text" : "password";
        icon.className = isHidden ? "fa-regular fa-eye" : "fa-regular fa-eye-slash";
    }
</script>
</body>
</html>
