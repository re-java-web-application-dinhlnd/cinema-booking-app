spring.application.name=cinema-booking-app

spring.datasource.url=jdbc:mysql://localhost:3306/cinema_booking_db?createDatabaseIfNotExist=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true

spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# Thay the cac key nhay cam bang application-local.properties trong du an khong push len git cong khai
spring.profiles.active=local

cinewave.security.remember-me.key=replace-me-in-local-properties

tmdb.api-key=replace-me-in-local-properties
tmdb.base-url=https://api.themoviedb.org/3
tmdb.image-base-url=https://image.tmdb.org/t/p/w500